name: Build Android APK

on:
  push:
    branches: [main, master]
  workflow_dispatch: {}

jobs:
  build-apk:
    runs-on: ubuntu-22.04

    env:
      PIP_BREAK_SYSTEM_PACKAGES: "1"

    steps:
      - name: Checkout kode
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "17"

      - name: Install dependency sistem
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            git \
            zip \
            unzip \
            autoconf \
            automake \
            autopoint \
            libtool \
            libltdl-dev \
            libffi-dev \
            pkg-config \
            zlib1g-dev \
            ant \
            cmake \
            build-essential

      - name: Install buildozer & cython
        run: |
          python -m pip install --upgrade pip
          python -m pip install --user buildozer==1.6.0 cython==0.29.36

      - name: Cache buildozer & pip
        uses: actions/cache@v4
        with:
          path: |
            ~/.buildozer
            ~/.cache/pip
            .buildozer
          key: buildozer-ubuntu22-v3-${{ hashFiles('buildozer.spec') }}
          restore-keys: |
            buildozer-ubuntu22-v3-

      - name: Validate dan bersihkan Android SDK jika rusak
        shell: bash
        run: |
          export ANDROID_HOME="$HOME/.buildozer/android/platform/android-sdk"
          export ANDROID_SDK_ROOT="$ANDROID_HOME"

          echo "Checking Android SDK integrity..."

          if [ ! -d "$ANDROID_HOME/build-tools" ]; then
            echo "⚠️ build-tools folder tidak ditemukan, menghapus SDK cache..."
            rm -rf "$ANDROID_HOME"
          else
            if ! find "$ANDROID_HOME/build-tools" -type f -name "aidl" 2>/dev/null | grep -q .; then
              echo "⚠️ aidl tool tidak ditemukan, menghapus SDK cache..."
              rm -rf "$ANDROID_HOME"
            else
              echo "✅ Android SDK looks good"
            fi
          fi

      - name: Build APK debug
        shell: bash
        run: |
          set -o pipefail
          export PATH="$HOME/.local/bin:$PATH"

          export ANDROID_HOME="$HOME/.buildozer/android/platform/android-sdk"
          export ANDROID_SDK_ROOT="$ANDROID_HOME"

          mkdir -p "$HOME/.android"
          touch "$HOME/.android/repositories.cfg"

          for attempt in 1 2 3; do
            echo "========================================"
            echo "Build attempt: $attempt / 3"
            echo "========================================"

            if ~/.local/bin/buildozer -v android debug </dev/null; then
              echo "✅ Build APK berhasil."
              ls -lh bin/*.apk
              exit 0
            fi

            if [ "$attempt" -lt 3 ]; then
              echo "❌ Build gagal. Menunggu 30 detik sebelum retry..."
              sleep 30
            fi
          done

          echo "❌ Build gagal setelah 3 percobaan."
          exit 1

      - name: Upload APK sebagai artifact
        uses: actions/upload-artifact@v4
        with:
          name: face-attendance-debug-apk
          path: bin/*.apk
          if-no-files-found: error
