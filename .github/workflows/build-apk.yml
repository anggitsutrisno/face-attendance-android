name: Build Android APK

on:
  push:
    branches: [main, master]
  workflow_dispatch: {}

jobs:
  build-apk:
    runs-on: ubuntu-22.04

    env:
      PIP_BREAK_SYSTEM_PACKAGES: "1"
      PIP_DISABLE_PIP_VERSION_CHECK: "1"

    steps:

      # =========================================================
      # 1. CHECKOUT
      # =========================================================
      - name: Checkout kode
        uses: actions/checkout@v4


      # =========================================================
      # 2. PYTHON 3.11
      # =========================================================
      - name: Setup Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"


      # =========================================================
      # 3. JAVA 17
      # =========================================================
      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "17"
          cache: "gradle"


      # =========================================================
      # 4. SYSTEM DEPENDENCIES
      # =========================================================
      - name: Install dependency sistem
        shell: bash
        run: |
          set -e

          sudo apt-get update

          sudo apt-get install -y \
            git \
            zip \
            unzip \
            autoconf \
            automake \
            autopoint \
            libtool \
            libltdl-dev \
            libffi-dev \
            pkg-config \
            zlib1g-dev \
            ant \
            cmake \
            build-essential


      # =========================================================
      # 5. VERIFY ENVIRONMENT
      # =========================================================
      - name: Verify environment
        shell: bash
        run: |
          set -e

          echo "===== Python ====="
          python --version
          python -m pip --version

          echo "===== Java ====="
          java -version

          echo "===== Ant ====="
          ant -version

          echo "===== CMake ====="
          cmake --version

          echo "===== Git ====="
          git --version

          echo "===== Buildozer ====="
          if command -v buildozer >/dev/null 2>&1; then
            buildozer --version
          else
            echo "Buildozer belum terinstall"
          fi


      # =========================================================
      # 6. INSTALL BUILDOZER
      # =========================================================
      - name: Install Buildozer & Cython
        shell: bash
        run: |
          set -e

          python -m pip install --upgrade pip

          python -m pip install \
            --user \
            buildozer==1.6.0 \
            cython==0.29.36

          export PATH="$HOME/.local/bin:$PATH"

          buildozer --version


      # =========================================================
      # 7. CACHE BUILDOZER
      # =========================================================
      - name: Cache Buildozer
        uses: actions/cache@v4
        with:
          path: |
            ~/.buildozer
            ~/.cache/pip
            .buildozer
          key: buildozer-ubuntu22-final-${{ hashFiles('buildozer.spec') }}
          restore-keys: |
            buildozer-ubuntu22-final-


      # =========================================================
      # 8. CHECK ANDROID SDK
      # =========================================================
      - name: Validate Android SDK
        shell: bash
        run: |
          set -e

          export ANDROID_HOME="$HOME/.buildozer/android/platform/android-sdk"
          export ANDROID_SDK_ROOT="$ANDROID_HOME"

          echo "ANDROID_HOME=$ANDROID_HOME"

          if [ -d "$ANDROID_HOME/build-tools" ]; then

            if find "$ANDROID_HOME/build-tools" \
              -type f \
              -name "aidl" \
              2>/dev/null | grep -q .; then

              echo "✅ Android SDK cache terlihat valid."

            else

              echo "⚠️ AIDL tidak ditemukan."
              echo "Membersihkan Android SDK cache..."

              rm -rf "$ANDROID_HOME"

            fi

          else

            echo "ℹ️ Android SDK belum tersedia."
            echo "Buildozer akan menyiapkannya."

          fi


      # =========================================================
      # 9. ANDROID CONFIG
      # =========================================================
      - name: Prepare Android environment
        shell: bash
        run: |
          set -e

          export ANDROID_HOME="$HOME/.buildozer/android/platform/android-sdk"
          export ANDROID_SDK_ROOT="$ANDROID_HOME"

          mkdir -p "$HOME/.android"

          touch "$HOME/.android/repositories.cfg"

          echo "ANDROID_HOME=$ANDROID_HOME"
          echo "ANDROID_SDK_ROOT=$ANDROID_SDK_ROOT"

          echo "Checking network..."

          curl -I --max-time 15 https://github.com >/dev/null

          echo "✅ GitHub network reachable."


      # =========================================================
      # 10. BUILD APK
      # =========================================================
      - name: Build APK Debug
        shell: bash
        timeout-minutes: 90
        run: |
          set -o pipefail

          export PATH="$HOME/.local/bin:$PATH"

          export ANDROID_HOME="$HOME/.buildozer/android/platform/android-sdk"
          export ANDROID_SDK_ROOT="$ANDROID_HOME"

          mkdir -p "$HOME/.android"
          touch "$HOME/.android/repositories.cfg"

          echo ""
          echo "=============================================="
          echo "     FACE ATTENDANCE ANDROID BUILD"
          echo "=============================================="
          echo ""

          echo "Python:"
          python --version

          echo ""
          echo "Buildozer:"
          buildozer --version

          echo ""
          echo "Starting Buildozer..."
          echo ""

          for attempt in 1 2 3; do

            echo ""
            echo "=============================================="
            echo "BUILD ATTEMPT $attempt / 3"
            echo "=============================================="
            echo ""

            if yes | buildozer -v android debug; then

              echo ""
              echo "=============================================="
              echo "✅ BUILD BERHASIL"
              echo "=============================================="
              echo ""

              if ls bin/*.apk >/dev/null 2>&1; then
                ls -lh bin/*.apk
              else
                echo "❌ APK tidak ditemukan."
                exit 1
              fi

              exit 0

            fi

            echo ""
            echo "❌ Build attempt $attempt gagal."

            if [ "$attempt" -lt 3 ]; then
              echo ""
              echo "Menunggu 60 detik sebelum mencoba lagi..."
              sleep 60
            fi

          done

          echo ""
          echo "=============================================="
          echo "❌ BUILD GAGAL SETELAH 3 PERCOBAAN"
          echo "=============================================="
          exit 1


      # =========================================================
      # 11. UPLOAD APK
      # =========================================================
      - name: Upload APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: face-attendance-debug-apk
          path: bin/*.apk
          if-no-files-found: error
