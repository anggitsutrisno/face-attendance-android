name: Build Android APK

on:
  push:
    branches: [main, master]
  workflow_dispatch: {}

jobs:
  build-apk:
    runs-on: ubuntu-22.04

    env:
      PIP_BREAK_SYSTEM_PACKAGES: "1"

    steps:
      - name: Checkout kode
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "17"

      - name: Cache buildozer & pip
        uses: actions/cache@v4
        with:
          path: |
            ~/.buildozer
            ~/.cache/pip
            .buildozer
          key: buildozer-ubuntu22-${{ hashFiles('buildozer.spec') }}
          restore-keys: |
            buildozer-ubuntu22-

      - name: Install dependency sistem
        run: |
          sudo apt update
          sudo apt install -y \
            git \
            zip \
            unzip \
            openjdk-17-jdk \
            autoconf \
            automake \
            autopoint \
            libtool \
            libltdl-dev \
            libffi-dev \
            pkg-config \
            zlib1g-dev \
            ant \
            cmake \
            build-essential

      - name: Install buildozer & cython
        run: |
          pip install --user buildozer==1.6.0 cython

      - name: Build APK debug
        run: |
          for attempt in 1 2 3; do
            echo "========================================"
            echo "Build attempt: $attempt / 3"
            echo "========================================"

            if ~/.local/bin/buildozer -v android debug </dev/null; then
              echo "✅ Build APK berhasil."
              ls -lh bin/*.apk
              exit 0
            fi

            if [ "$attempt" -lt 3 ]; then
              echo "❌ Build gagal. Menunggu 30 detik sebelum retry..."
              sleep 30
            fi
          done

          echo "❌ Build gagal setelah 3 percobaan."
          exit 1

      - name: Upload APK sebagai artifact
        uses: actions/upload-artifact@v4
        with:
          name: face-attendance-debug-apk
          path: bin/*.apk
          if-no-files-found: error